version: '3.8'

services:

  autenticacion-service:
    build: ./autenticacion-service
    container_name: autenticacion-service
    ports:
      - "8081:8081"
    environment:
      WALLET_PATH: /wallet
    volumes:
      - ./wallet:/wallet

  empleado-service:
    build: ./empleado-service
    container_name: empleado-service
    ports:
      - "8082:8082"
    environment:
      WALLET_PATH: /wallet
      AUTH_SERVICE_URL: http://autenticacion-service:8081
    volumes:
      - ./wallet:/wallet
    depends_on:
      - autenticacion-service

  producto-service:
    build: ./producto-service
    container_name: producto-service
    ports:
      - "8083:8083"
    environment:
      WALLET_PATH: /wallet
    volumes:
      - ./wallet:/wallet

  inventario-service:
    build: ./inventario-service
    container_name: inventario-service
    ports:
      - "8084:8084"
    environment:
      WALLET_PATH: /wallet
      PRODUCTO_SERVICE_URL: http://producto-service:8083
    volumes:
      - ./wallet:/wallet
    depends_on:
      - producto-service

  venta-service:
    build: ./venta-service
    container_name: venta-service
    ports:
      - "8085:8085"
    environment:
      WALLET_PATH: /wallet
      EMPLEADO_SERVICE_URL: http://empleado-service:8082
      PRODUCTO_SERVICE_URL: http://producto-service:8083
      INVENTARIO_SERVICE_URL: http://inventario-service:8084
    volumes:
      - ./wallet:/wallet
    depends_on:
      - empleado-service
      - producto-service
      - inventario-service

  reporte-service:
    build: ./reporte-service
    container_name: reporte-service
    ports:
      - "8086:8086"
    environment:
      WALLET_PATH: /wallet
      VENTA_SERVICE_URL: http://venta-service:8085
      EMPLEADO_SERVICE_URL: http://empleado-service:8082
      PRODUCTO_SERVICE_URL: http://producto-service:8083
    volumes:
      - ./wallet:/wallet
    depends_on:
      - venta-service
      - empleado-service
      - producto-service